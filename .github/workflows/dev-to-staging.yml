name: Dev → Staging

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

jobs:
  extract-all-tasks:
    runs-on: ubuntu-latest
    outputs:
      task_codes: ${{ steps.extract.outputs.task_codes }}
      has_tasks: ${{ steps.extract.outputs.has_tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract All Task Codes from commit log
        id: extract
        run: |
          git fetch origin staging

          echo "=== Commit log ==="
          git log origin/staging..HEAD --pretty=format:"%s"
          echo "=== End log ==="

          # Ganti grep -oP dengan grep -E + sed yang lebih compatible
          TASK_CODES=$(git log origin/staging..HEAD --pretty=format:"%s" \
            | grep -oE '\[[A-Z]+-[0-9]+\]' \
            | tr -d '[]' \
            | sort -u \
            | tr '\n' ' ')

          echo "Raw task codes: '$TASK_CODES'"

          if [ -z "$(echo $TASK_CODES | tr -d ' ')" ]; then
            echo "No task codes found"
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "task_codes=" >> $GITHUB_OUTPUT
          else
            JSON_ARRAY=$(echo "$TASK_CODES" \
              | tr ' ' '\n' \
              | grep -v '^$' \
              | awk '{printf "\"%s\",", $1}' \
              | sed 's/,$//' \
              | sed 's/.*/[&]/')

            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "task_codes=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "Found tasks: $JSON_ARRAY"
          fi


  # ← pastikan sejajar dengan extract-all-tasks (tidak ada indent lebih)
  build:
    needs: extract-all-tasks
    # Hapus if di sini, selalu jalan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip build (bypass mode)
        run: echo "Build bypassed for testing"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Skip deploy (bypass mode)
        run: echo "Deploy bypassed for testing"

  bulk-update-success:
    needs: [extract-all-tasks, deploy]
    # Ganti success() → eksplisit
    if: |
      needs.deploy.result == 'success' &&
      needs.extract-all-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/bulk-task → update status
        run: |
          curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.TASK_API_URL }}/api/bulk-task" \
            -H "Authorization: Bearer ${{ secrets.TASK_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ids": ${{ needs.extract-all-tasks.outputs.task_codes }}}'

  bulk-update-failed:
    needs: [extract-all-tasks, build, deploy]
    # Ganti failure() → eksplisit
    if: |
      (needs.build.result == 'failure' || needs.deploy.result == 'failure') &&
      needs.extract-all-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Detect failed job
        id: detect
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "stage=build-docker" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "stage=deploy-staging" >> $GITHUB_OUTPUT
          fi

      - name: Hit /api/bulk-task-failed → fixing
        run: |
          curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.TASK_API_URL }}/api/bulk-task-failed" \
            -H "Authorization: Bearer ${{ secrets.TASK_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ids": ${{ needs.extract-all-tasks.outputs.task_codes }}}'
